<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot CFPTSJ</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        input, button { font-size: 16px; padding: 10px; margin: 5px; }
        #response { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Posez votre question au Chatbot CFPTSJ</h2>
    
    <form id="chat-form">
        <input type="text" id="query" name="query" placeholder="Tapez votre question ici..." required>
        <button type="submit">Envoyer</button>
    </form>

    <div id="response"></div>

    <script>
        document.getElementById("chat-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const query = document.getElementById("query").value;
            const responseDiv = document.getElementById("response");

            responseDiv.innerHTML = "⏳ Recherche en cours...";

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();
            responseDiv.innerHTML = `<p><strong>Question :</strong> ${data.question}</p>
                                     <p><strong>Réponse :</strong> ${data.response}</p>`;
        });
    </script>
</body>
</html>
